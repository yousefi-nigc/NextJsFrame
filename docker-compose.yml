services:
  postgres:
    image: postgres:16-alpine
    container_name: gastop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastop
      POSTGRES_PASSWORD: gastop123
      POSTGRES_DB: gastop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        DATABASE_URL: postgresql://gastop:gastop123@postgres:5432/gastop?schema=public
    container_name: gastop-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://gastop:gastop123@postgres:5432/gastop?schema=public
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-nXR5o8GxxnP5nESHyLIa8BjzucgOIE3d}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    command: >
      sh -c "
        npx prisma migrate deploy || true;
        npm run start
      "

volumes:
  postgres_data:
