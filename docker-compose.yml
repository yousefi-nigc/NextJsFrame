services:
  postgres:
    image: postgres:16-alpine
    container_name: gastop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastop
      POSTGRES_PASSWORD: gastop123
      POSTGRES_DB: gastop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: gastop-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    command: ["npm", "run", "start"]

volumes:
  postgres_data:
